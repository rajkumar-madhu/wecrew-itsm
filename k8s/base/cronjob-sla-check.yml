apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkedeye-sla-check
  labels:
    app.kubernetes.io/name: linkedeye-sla-check
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: linkedeye
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linkedeye-sla-check
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          containers:
            - name: sla-check
              image: linkedeye/api:2.0.0
              command: ["node", "scripts/check-sla.js"]
              envFrom:
                - configMapRef:
                    name: linkedeye-config
                - secretRef:
                    name: linkedeye-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
