---
# Default deny all ingress traffic in linkedeye-core namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress controller -> frontend (port 80)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

---
# Allow frontend -> backend (port 5000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: linkedeye-frontend
      ports:
        - protocol: TCP
          port: 5000
    # Allow ingress controller direct to API for /api/* routes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000

---
# Allow backend -> PostgreSQL (port 5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: linkedeye-api
      ports:
        - protocol: TCP
          port: 5432

---
# Allow backend -> Redis (port 6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-redis
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: linkedeye-api
      ports:
        - protocol: TCP
          port: 6379

---
# Allow backend -> Prometheus (port 9090)
# Allow backend -> Loki (port 3100)
# Allow backend -> Grafana (port 3000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-observability
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-api
  policyTypes:
    - Egress
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: linkedeye-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: linkedeye-redis
      ports:
        - protocol: TCP
          port: 6379
    # Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkedeye-ai
      ports:
        - protocol: TCP
          port: 9090
    # Loki
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkedeye-ai
      ports:
        - protocol: TCP
          port: 3100
    # Grafana
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkedeye-ai
      ports:
        - protocol: TCP
          port: 3000
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow Prometheus -> backend (scrape /metrics on port 5000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-api
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: linkedeye-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkedeye-ai
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 5000
