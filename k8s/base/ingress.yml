apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedeye-ingress
  namespace: linkedeye-core
  labels:
    app.kubernetes.io/part-of: linkedeye
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/websocket-services: linkedeye-api
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - linkedeye.santhira.com
      secretName: linkedeye-tls
  rules:
    - host: linkedeye.santhira.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkedeye-frontend
                port:
                  number: 80
