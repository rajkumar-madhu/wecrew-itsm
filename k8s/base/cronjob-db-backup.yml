apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkedeye-db-backup
  labels:
    app.kubernetes.io/name: linkedeye-db-backup
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: linkedeye
spec:
  schedule: "30 20 * * *"  # 2:00 AM IST (UTC+5:30)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linkedeye-db-backup
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          containers:
            - name: db-backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/linkedeye_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump "${DATABASE_URL}" | gzip > "${BACKUP_FILE}"
                  echo "Backup complete: $(du -h ${BACKUP_FILE} | cut -f1)"
                  # Retain last 30 daily backups
                  ls -t /backups/linkedeye_*.sql.gz | tail -n +31 | xargs -r rm
                  echo "Cleanup complete. Remaining backups: $(ls /backups/linkedeye_*.sql.gz | wc -l)"
              envFrom:
                - configMapRef:
                    name: linkedeye-config
                - secretRef:
                    name: linkedeye-secrets
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: linkedeye-db-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkedeye-db-backups
  labels:
    app.kubernetes.io/name: linkedeye-db-backups
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: linkedeye
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
