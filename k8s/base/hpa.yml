apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkedeye-api-hpa
  namespace: linkedeye-core
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
