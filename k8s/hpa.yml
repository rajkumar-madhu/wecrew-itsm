apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkedeye-api-hpa
  namespace: itsm-wecrew
  labels:
    app.kubernetes.io/part-of: linkedeye
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-api
  # Single-node cluster — keep floor at 1; allow modest burst.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
