apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-frontend
  namespace: linkedeye-core
  labels:
    app: linkedeye-frontend
    app.kubernetes.io/name: linkedeye-frontend
    app.kubernetes.io/part-of: linkedeye
spec:
  replicas: 1
  # Single node sitting at ~99% CPU requests: a surge pod cannot be scheduled,
  # so replace in place (brief downtime) instead of surging.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: linkedeye-frontend
  template:
    metadata:
      labels:
        app: linkedeye-frontend
    spec:
      imagePullSecrets:
        - name: harbor-linkedeye-pull
      containers:
        - name: frontend
          image: harbor.wecrew.in/linkedeye/argus-itsm-frontend:20260816-coral
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          # Sized down for the single-node kind cluster; matches what is live.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-frontend
  namespace: linkedeye-core
  labels:
    app: linkedeye-frontend
spec:
  selector:
    app: linkedeye-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
