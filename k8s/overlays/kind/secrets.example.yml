apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: linkedeye-core
type: Opaque
stringData:
  password: "<REPLACE-ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: linkedeye-secrets
  namespace: linkedeye-core
type: Opaque
stringData:
  DATABASE_URL: "<REPLACE-ME>"
  REDIS_URL: "<REPLACE-ME>"
  JWT_SECRET: "<REPLACE-ME>"
  JWT_REFRESH_SECRET: "<REPLACE-ME>"
  # Encrypts 2FA secrets. Set once, before anyone enrols; changing it breaks enrolments.
  MFA_ENCRYPTION_KEY: "<REPLACE-ME>"
  # Keycloak SSO — all four set turns the "Sign in with Keycloak SSO" button on.
  # Client redirect URI: https://itsm.wecrew.in/api/v1/auth/sso/callback
  KEYCLOAK_URL: "https://keycloak-dev.finspot.in"
  KEYCLOAK_REALM: "<REPLACE-ME>"
  KEYCLOAK_CLIENT_ID: "<REPLACE-ME>"
  KEYCLOAK_CLIENT_SECRET: "<REPLACE-ME>"
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  GRAFANA_API_KEY: ""
