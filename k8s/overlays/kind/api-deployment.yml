apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-api
  namespace: linkedeye-core
  labels:
    app: linkedeye-api
    app.kubernetes.io/name: linkedeye-api
    app.kubernetes.io/part-of: linkedeye
spec:
  replicas: 1
  # Single node sitting at ~99% CPU requests: a surge pod cannot be scheduled,
  # so replace in place (brief downtime) instead of surging.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: linkedeye-api
  template:
    metadata:
      labels:
        app: linkedeye-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      # Read-only cluster access for the in-app Kubernetes module (see rbac.yml).
      serviceAccountName: linkedeye-k8s-viewer
      imagePullSecrets:
        - name: harbor-linkedeye-pull
      containers:
        - name: api
          image: harbor.wecrew.in/linkedeye/argus-itsm-api:20260807-794da2b-k8sfix
          imagePullPolicy: IfNotPresent
          command: ["sh","-c"]
          args:
            - |
              npx prisma db push --accept-data-loss --skip-generate 2>/dev/null || true
              node src/server.js
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: linkedeye-secrets
            - configMapRef:
                name: linkedeye-config
          # Sized down for the single-node kind cluster; matches what is live.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-api
  namespace: linkedeye-core
  labels:
    app: linkedeye-api
spec:
  selector:
    app: linkedeye-api
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
