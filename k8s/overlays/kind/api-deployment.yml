apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-api
  namespace: linkedeye-core
  labels:
    app: linkedeye-api
    app.kubernetes.io/name: linkedeye-api
    app.kubernetes.io/part-of: linkedeye
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedeye-api
  template:
    metadata:
      labels:
        app: linkedeye-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: linkedeye/api:kind
          imagePullPolicy: IfNotPresent
          command: ["sh","-c"]
          args:
            - |
              npx prisma db push --accept-data-loss --skip-generate 2>/dev/null || true
              node src/server.js
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: linkedeye-secrets
            - configMapRef:
                name: linkedeye-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-api
  namespace: linkedeye-core
  labels:
    app: linkedeye-api
spec:
  selector:
    app: linkedeye-api
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
