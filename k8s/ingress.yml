apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedeye-itsm-ingress
  namespace: itsm-wecrew
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/websocket-services: linkedeye-api
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - itsm.wecrew.in
        - itsm.api.wecrew.in
      secretName: itsm-wecrew-tls
  rules:
    - host: itsm.wecrew.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkedeye-frontend
                port:
                  number: 80
    - host: itsm.api.wecrew.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkedeye-api
                port:
                  number: 5000
