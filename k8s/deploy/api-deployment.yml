apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-api
  namespace: fs-linkedeye
  labels:
    app: linkedeye-api
    app.kubernetes.io/name: linkedeye-api
    app.kubernetes.io/part-of: linkedeye-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedeye-api
  template:
    metadata:
      labels:
        app: linkedeye-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: linkedeye/api:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: linkedeye-v2-secrets
            - configMapRef:
                name: linkedeye-v2-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-api
  namespace: fs-linkedeye
  labels:
    app: linkedeye-api
    app.kubernetes.io/part-of: linkedeye-v2
spec:
  selector:
    app: linkedeye-api
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
