apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-frontend
  namespace: fs-linkedeye
  labels:
    app: linkedeye-frontend
    app.kubernetes.io/name: linkedeye-frontend
    app.kubernetes.io/part-of: linkedeye-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedeye-frontend
  template:
    metadata:
      labels:
        app: linkedeye-frontend
    spec:
      containers:
        - name: frontend
          image: linkedeye/frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-frontend
  namespace: fs-linkedeye
  labels:
    app: linkedeye-frontend
    app.kubernetes.io/part-of: linkedeye-v2
spec:
  selector:
    app: linkedeye-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
