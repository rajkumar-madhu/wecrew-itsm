apiVersion: v1
kind: ConfigMap
metadata:
  name: linkedeye-v2-config
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/part-of: linkedeye-v2
data:
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_URL: "https://itsm.wecrew.in"
  CORS_ORIGINS: "https://itsm.wecrew.in,http://itsm.wecrew.in"
  PROMETHEUS_URL: "http://prometheus:9090"
  LOKI_URL: "http://loki:3100"
  GRAFANA_URL: "http://grafana:3000"
  OLLAMA_URL: "http://ollama:11434"
  VOICE_SERVER_URL: "http://voice-server:8100"
  SLACK_DEFAULT_CHANNEL: "#incidents"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
---
apiVersion: v1
kind: Secret
metadata:
  name: linkedeye-v2-secrets
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/part-of: linkedeye-v2
type: Opaque
stringData:
  DATABASE_URL: "postgresql://saasapp:VoiceSaas2024!@postgresql.postgresql-saas.svc.cluster.local:5432/linkedeye?schema=public"
  REDIS_URL: "redis://redis.fs-linkedeye.svc.cluster.local:6379"
  JWT_SECRET: "linkedeye-jwt-secret-2026-prod"
  JWT_REFRESH_SECRET: "linkedeye-jwt-refresh-secret-2026-prod"
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  GRAFANA_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
