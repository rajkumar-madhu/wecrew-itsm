apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkedeye-api
  name: linkedeye-api
  namespace: wecrew-itsm
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: linkedeye-api
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-09-18T23:32:58Z'
      labels:
        app: linkedeye-api
    spec:
      containers:
      - args:
        - src/server.js
        command:
        - node
        envFrom:
        - secretRef:
            name: linkedeye-secrets
        - configMapRef:
            name: linkedeye-config
        image: harbor.wecrew.in/linkedeye/argus-itsm-api:20260919-wecrew-org
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-linkedeye-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: linkedeye-k8s-viewer
      serviceAccountName: linkedeye-k8s-viewer
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-api
  namespace: wecrew-itsm
spec:
  ports:
  - name: http
    port: 5000
    protocol: TCP
    targetPort: 5000
  selector:
    app: linkedeye-api
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/part-of: linkedeye
  name: linkedeye-api-hpa
  namespace: wecrew-itsm
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-api
