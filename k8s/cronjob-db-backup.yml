apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkedeye-db-backups
  namespace: itsm-wecrew
  labels:
    app.kubernetes.io/name: linkedeye-db-backups
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: linkedeye
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkedeye-db-backup
  namespace: itsm-wecrew
  labels:
    app.kubernetes.io/name: linkedeye-db-backup
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: linkedeye
spec:
  schedule: "30 20 * * *" # 02:00 IST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linkedeye-db-backup
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          containers:
            - name: db-backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  # Prisma URLs carry ?schema=public — strip for libpq/pg_dump
                  DB_URL="${DATABASE_URL%%\?*}"
                  echo "Waiting for postgres..."
                  for i in $(seq 1 30); do
                    if pg_isready -d "$DB_URL" >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done
                  pg_isready -d "$DB_URL"
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/linkedeye_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump "${DB_URL}" | gzip > "${BACKUP_FILE}"
                  echo "Backup complete: $(du -h "${BACKUP_FILE}" | cut -f1)"
                  ls -t /backups/linkedeye_*.sql.gz | tail -n +31 | xargs -r rm
                  echo "Cleanup complete. Remaining: $(ls /backups/linkedeye_*.sql.gz | wc -l)"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: linkedeye-secrets
                      key: DATABASE_URL
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: linkedeye-db-backups
