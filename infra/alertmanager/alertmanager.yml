# WeCrew ITSM — Alertmanager Configuration
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'linkedeye-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'linkedeye-webhook'
      group_wait: 5s
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: 'linkedeye-webhook'
      repeat_interval: 30m

receivers:
  - name: 'linkedeye-webhook'
    webhook_configs:
      - url: 'http://api:5000/api/v1/webhooks/alertmanager'
        send_resolved: true
