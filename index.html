<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#F7F7FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('wecrew-theme');
          var theme = 'light';
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.state && p.state.theme === 'dark') theme = 'dark';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#15131F' : '#F7F7FA');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <title>WeCrew ITSM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-void">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Voice widget: see CLAUDE.md before re-adding. -->
  </body>
</html>
